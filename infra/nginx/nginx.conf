###############################################################################
#  nginx — comercializadoramorenosantos.com
#  Bot detection + Prerender.io proxy para React SPA
###############################################################################

# Lista de bots a prerenderizar
map $http_user_agent $prerender_ua {
    default         0;
    "~*googlebot"   1;
    "~*bingbot"     1;
    "~*yandexbot"   1;
    "~*duckduckbot" 1;
    "~*slurp"       1;
    "~*baiduspider" 1;
    "~*facebookexternalhit" 1;
    "~*twitterbot"  1;
    "~*linkedinbot" 1;
    "~*whatsapp"    1;
    "~*telegrambot" 1;
    "~*applebot"    1;
    "~*rogerbot"    1;
    "~*semrushbot"  1;
    "~*ahrefsbot"   1;
}

# Si viene el parámetro _escaped_fragment_ también prerenderizar
map $args $prerender_qs {
    default 0;
    "~*_escaped_fragment_" 1;
}

# Resultado final: prerenderizar si es bot O si tiene el parámetro especial
map "$prerender_ua:$prerender_qs" $prerender {
    "~*1" 1;
    default 0;
}

###############################################################################
server {
    listen 80;
    server_name comercializadoramorenosantos.com www.comercializadoramorenosantos.com;

    # Redirige todo HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name comercializadoramorenosantos.com www.comercializadoramorenosantos.com;

    # ── SSL (Let's Encrypt) ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/comercializadoramorenosantos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comercializadoramorenosantos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Seguridad básica ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/html;
    index index.html;

    # ── Sitemap dinámico — proxy al backend FastAPI ────────────────────────
    location = /sitemap.xml {
        proxy_pass         http://127.0.0.1:8000/sitemap.xml;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 1h;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=3600";
    }

    # ── API backend ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── React SPA con Prerendering ──────────────────────────────────────────
    location / {
        # Si es un bot → proxy a Prerender.io (puerto 3000)
        if ($prerender = 1) {
            rewrite .* /https://comercializadoramorenosantos.com$request_uri? break;
            proxy_pass http://127.0.0.1:3000;
        }

        # Archivos estáticos del build de React (dist/)
        try_files $uri $uri/ /index.html;

        # Cache agresivo para assets con hash en el nombre
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Uploads / archivos subidos ──────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
    }

    # ── Logs ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/cms_access.log;
    error_log  /var/log/nginx/cms_error.log warn;
}
