# ==============================
# BOT DETECTION — Prerender.io
# ==============================
map $http_user_agent $is_bot {
    default         0;
    "~*googlebot"   1;
    "~*bingbot"     1;
    "~*yandexbot"   1;
    "~*duckduckbot" 1;
    "~*slurp"       1;
    "~*baiduspider" 1;
    "~*facebookexternalhit" 1;
    "~*twitterbot"  1;
    "~*linkedinbot" 1;
    "~*whatsapp"    1;
    "~*telegrambot" 1;
    "~*applebot"    1;
    "~*rogerbot"    1;
    "~*semrushbot"  1;
    "~*ahrefsbot"   1;
}

# ==============================
# FRONTEND
# ==============================
server {
    server_name comercializadoramorenosantos.com www.comercializadoramorenosantos.com;
    charset utf-8;
    root /var/www/html;
    index index.html;
    client_max_body_size 10M;

    # CSP para el frontend React
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://checkout.epayco.co https://ajax.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.comercializadoramorenosantos.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://checkout.epayco.co; font-src 'self' data: https://fonts.gstatic.com; frame-src https://checkout.epayco.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";

    # Sitemap dinámico — proxy al backend FastAPI
    location = /sitemap.xml {
        proxy_pass         http://127.0.0.1:8000/sitemap.xml;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        include snippets/security.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /assets/ {
        include snippets/security.conf;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2|woff)$ {
        include snippets/security.conf;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        include snippets/security.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache";

        # Si es un bot → Prerender.io
        if ($is_bot = 1) {
            rewrite .* /https://comercializadoramorenosantos.com$request_uri? break;
            proxy_pass http://127.0.0.1:3000;
        }

        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/comercializadoramorenosantos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comercializadoramorenosantos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ==============================
# API (PUERTO 8000)
# ==============================
server {
    server_name api.comercializadoramorenosantos.com;
    client_max_body_size 10M;

    # Imágenes y uploads — sin rate limit (son estáticos)
    location /upload/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=2592000";
    }

    location / {
        include snippets/security.conf;
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/comercializadoramorenosantos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comercializadoramorenosantos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ==============================
# REDIRECTS HTTP -> HTTPS
# ==============================
server {
    listen 80;
    server_name comercializadoramorenosantos.com www.comercializadoramorenosantos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.comercializadoramorenosantos.com;
    return 301 https://$host$request_uri;
}
